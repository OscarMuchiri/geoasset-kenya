services:
  - type: web
    name: geoasset-kenya-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geoasset-kenya-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app

databases:
  - name: geoasset-kenya-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: geoasset
    user: geoasset
